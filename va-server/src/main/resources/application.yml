server:
  port: ${VA_PORT:9000}

spring:
  application:
    name: vision-assistant
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 1000MB
  # 前端构建产物（va-web/dist）直接由后端托管；从 va-server 目录启动时 ../va-web/dist 生效
  web:
    resources:
      static-locations: classpath:/static/, file:../va-web/dist/

va:
  # 逗号分隔 API Key 白名单；空 = 关闭鉴权（仅限本机开发）。环境变量 VA_API_KEYS
  api-keys: ${VA_API_KEYS:}
  ocr-base-url: ${VA_OCR_BASE_URL:http://127.0.0.1:48763}
  ipcheck-base-url: ${VA_IPCHECK_BASE_URL:http://127.0.0.1:8001}
  # 单次下游请求超时（大图 OCR 单任务 100~200s）
  http-timeout: 600s
  # OCR 推理全局串行，闸门保持 1
  ocr-concurrency: 1
  # 下游大图返回 202 时的轮询参数
  ocr-poll-interval: 2s
  ocr-poll-timeout: 900s
  # 异步任务：SQLite 任务库 / 流水线并发 / 回调重试（指数退避）
  data-dir: ${VA_DATA_DIR:./data}
  task-concurrency: ${VA_TASK_CONCURRENCY:2}
  task-webhook-max-attempts: ${VA_TASK_WEBHOOK_MAX_ATTEMPTS:3}
  task-webhook-backoff: ${VA_TASK_WEBHOOK_BACKOFF:2s}
  # 设置后任务回调携带 X-VA-Signature（HMAC-SHA256(body)）
  webhook-secret: ${VA_WEBHOOK_SECRET:}

logging:
  level:
    com.bz.va: INFO
